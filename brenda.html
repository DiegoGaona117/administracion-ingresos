<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categorías · Presupuesto mensual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Favicon -->
<!-- Favicon -->
<!-- Favicon -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234E5BF2'/><rect x='16' y='34' width='68' height='32' rx='6' fill='%233748D6'/><rect x='16' y='34' width='68' height='32' rx='6' fill='none' stroke='white' stroke-width='2.5' stroke-opacity='.6'/><circle cx='50' cy='50' r='11' fill='white' fill-opacity='.9'/><text y='55' x='50' text-anchor='middle' font-size='15' font-family='sans-serif' font-weight='800' fill='%233748D6'>$</text><circle cx='24' cy='42' r='2' fill='white' fill-opacity='.7'/><circle cx='76' cy='58' r='2' fill='white' fill-opacity='.7'/></svg>">
  <style>
  :root{
    --bg:#FFFFFF;
    --ink:#111318;
    --ink-soft:#8A8F98;
    --line:#EEEFF2;
    --card:#F7F7F9;
    --blue:#4E5BF2;
    --blue-soft:#EEF0FE;
    --green:#1FA971;
    --gold:#D79A1F;
    --red:#E5533D;
    --ring-bg:#E7E8EE;
    --kb-offset:0px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:520px; margin:0 auto; padding:22px 10px 90px;}

  /* header */
  header{ margin-bottom:6px; }
  .eyebrow{ font-size:13px; color:var(--ink-soft); font-weight:600; margin:0 0 2px; }
  h1{ font-size:26px; font-weight:800; margin:0 0 18px; letter-spacing:-0.02em; }

  .summary-card.single{
    background:var(--card); border-radius:18px; padding:4px; margin-bottom:22px;
    display:grid; grid-template-columns:2fr 1.5fr; align-items:center; gap:14px;
  }
  .summary-left{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .summary-left .lbl{font-size:12.5px; color:var(--ink-soft); font-weight:600;}
  .summary-left .num{font-size:32px; font-weight:800; letter-spacing:-0.02em;}
  .summary-left .num.neg{ color:var(--red); }

  .summary-right{
    display:flex; align-items:center; justify-content:center;
    aspect-ratio:1/1; width:100%;
  }
  .total-face{ width:100%; height:100%; object-fit:contain; transition:transform .25s ease; }
  .total-face-fallback{
    display:flex; align-items:center; justify-content:center;
    font-size:44px; line-height:1;
  }

  .drain-track{
    width:100%; height:10px; background:var(--ring-bg);
    border-radius:6px; overflow:hidden; margin-top:10px;
  }
  .drain-fill{
    height:100%; width:100%; background:var(--green); border-radius:6px;
    transition:width .4s ease, background .5s ease;
  }
  .drain-caption{ font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-top:6px; }

  .section-title{
    display:flex; justify-content:space-between; align-items:center; margin:26px 0 10px;
  }
  .section-title h2{font-size:15px; font-weight:700; margin:0;}
  .section-title button{
    border:none; background:var(--blue-soft); color:var(--blue); font-weight:700; font-size:13px;
    padding:7px 13px; border-radius:20px; cursor:pointer;
  }
  .section-title button:active{opacity:.8;}

  /* rows */
  .list{ display:flex; flex-direction:column; }
  .row{
    display:flex; align-items:center; gap:14px;
    padding:13px 4px; border-bottom:1px solid var(--line);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .row:last-child{border-bottom:none;}

  .ring-wrap{ position:relative; width:52px; height:52px; flex:0 0 52px; }
  .ring-wrap svg{ position:absolute; inset:0; transform:rotate(-90deg); }
  .ring-wrap svg circle{ fill:none; stroke-width:3.5; }
  .ring-bg{ stroke:var(--ring-bg); }
  .ring-fill{ stroke:var(--green); stroke-linecap:round; transition:stroke-dashoffset .4s ease, stroke .3s ease; }
  .row.warn .ring-fill{ stroke:var(--gold); }
  .row.over .ring-fill{ stroke:var(--red); }
  .icon-emoji{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:22px;
  }

  .row-mid{ flex:1; min-width:0; }
  .row-name{ font-size:15.5px; font-weight:700; margin-bottom:2px; }
  .row-sub{ font-size:12.5px; color:var(--ink-soft); }
  .row-sub.over{ color:var(--red); font-weight:600; }

  .row-right{ text-align:right; flex-shrink:0; }
  .row-amt{ font-size:16px; font-weight:800; }
  .row-amt.over{ color:var(--red); }
  .row-budget{ font-size:11.5px; color:var(--ink-soft); }

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:14px;
    border:1.5px dashed var(--line); border-radius:16px;
  }

  /* expanded detail */
  .detail{
    display:none; padding:6px 4px 16px 66px; border-bottom:1px solid var(--line);
  }
  .detail.open{ display:block; }
  .detail-actions{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .chip-btn{
    border:none; border-radius:20px; padding:8px 14px; font-size:12.5px; font-weight:700;
    cursor:pointer;
  }
  .chip-btn.primary{ background:var(--blue); color:#fff; }
  .chip-btn.ghost{ background:var(--card); color:var(--ink); }
  .chip-btn.danger{ background:#FDEDEB; color:var(--red); }

  .tx-row{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:6px 0; font-size:13px;
  }
  .tx-desc{ color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-date{ color:var(--ink-soft); font-size:11px; }
  .tx-amt{ font-weight:700; flex-shrink:0; }
  .tx-del{ border:none; background:none; color:var(--ink-soft); font-size:13px; cursor:pointer; flex-shrink:0; }
  .tx-del:hover{ color:var(--red); }
  .tx-empty{ color:var(--ink-soft); font-size:12.5px; font-style:italic; padding:4px 0; }

  /* modal */
  .modal-bg{
    position:fixed; inset:0; background:rgba(17,19,24,0.4);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
    padding-bottom:var(--kb-offset);
    transition:padding-bottom .12s ease;
  }
  .modal-bg.open{ display:flex; }
  .modal{
    background:#fff; width:100%; max-width:520px; border-radius:22px 22px 0 0;
    padding:24px 22px 30px; animation: slideUp .22s ease;
    max-height:85vh; overflow-y:auto;
  }
  @keyframes slideUp{ from{transform:translateY(16px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .modal h2{ font-size:19px; font-weight:800; margin:0 0 3px; }
  .modal .sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 13px;
    font-family:'Inter',sans-serif; font-size:15px; background:var(--card); color:var(--ink);
  }
  .field input:focus{ outline:none; border-color:var(--blue); }
  .field.amount input{ font-size:19px; font-weight:800; }
  .emoji-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .emoji-opt{
    width:38px; height:38px; border-radius:10px; border:1.5px solid var(--line); background:var(--card);
    font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .emoji-opt.sel{ border-color:var(--blue); background:var(--blue-soft); }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn{
    flex:1; border:none; border-radius:12px; padding:13px; font-size:14.5px; font-weight:700; cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn.primary{ background:var(--blue); color:#fff; }
  .btn.ghost{ background:var(--card); color:var(--ink); }

  footer{ text-align:center; color:var(--ink-soft); font-size:11.5px; margin-top:30px; }

  @media (max-width:380px){
    .detail{ padding-left:4px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow" id="mesLabel">Agosto 2026</p>
    <h1>Presupuesto del mes</h1>
  </header>

  <div class="summary-card single">
    <div class="summary-left">
      <span class="lbl">Total en apartados</span>
      <span class="num" id="valTotalApartados">$0</span>
      <div class="drain-track">
        <div class="drain-fill" id="drainFill"></div>
      </div>
      <span class="drain-caption" id="drainCaption">Disponible: 100%</span>
    </div>
    <div class="summary-right">
      <img class="total-face" id="totalFaceImg" src="" alt="estado de tu presupuesto">
      <span class="total-face total-face-fallback" id="totalFaceEmoji" style="display:none;"></span>
    </div>
  </div>

  <div class="section-title">
    <h2>Tus categorías</h2>
    <button id="btnNuevaCategoria">+ Categoría</button>
  </div>

  <div class="list" id="list"></div>

  <footer>Guardado solo en este navegador (localStorage) · <span id="btnResetMes" style="text-decoration:underline; cursor:pointer;">cerrar mes</span></footer>
</div>

<!-- Modal: nueva/editar categoría -->
<div class="modal-bg" id="modalCategoria">
  <div class="modal">
    <h2 id="catModalTitle">Nueva categoría</h2>
    <p class="sub">Ej. Comida, Transporte, Servicios (agua/luz/internet)</p>
    <div class="field">
      <label>Ícono</label>
      <div class="emoji-row" id="emojiRow"></div>
    </div>
    <div class="field">
      <label for="catNombre">Nombre</label>
      <input type="text" id="catNombre" placeholder="Comida" maxlength="30">
    </div>
    <div class="field amount">
      <label for="catBudget">Presupuesto este mes</label>
      <input type="number" id="catBudget" placeholder="2000" min="0" step="1">
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="catCancel">Cancelar</button>
      <button class="btn primary" id="catGuardar">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: nuevo gasto -->
<div class="modal-bg" id="modalGasto">
  <div class="modal">
    <h2>Registrar gasto</h2>
    <p class="sub" id="gastoCatNombre">Categoría</p>
    <div class="field amount">
      <label for="gastoMonto">Monto gastado</label>
      <input type="number" id="gastoMonto" placeholder="200" min="0" step="1" inputmode="decimal">
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="gastoCancel">Cancelar</button>
      <button class="btn primary" id="gastoGuardar">Registrar</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'presupuestoMensual_v2';
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const EMOJIS = ['🛒','🚗','🏠','💡','📶','🧴','🐾','👕','💊','✂','☕','📚','🎁','💳','🐱','🐶','🍔','🎓','🔧','💰','🍕','🍟','🍗','👗','🏋️‍♀️','🏋️‍♂️','🍝','🥣','🥤'];

  // Imágenes de la carita del total. Puedes reemplazar cada URL por la tuya.
  const TW = 'https://static.wixstatic.com/media/32c95b_';
  const FACE_IMAGES = {
    feliz:       TW + '4d3beec48f184c7ba3bfacb926b231e6~mv2.jpeg', // 😄
    contento:    TW + 'ff82f31da4314307a3794df4e5187977~mv2.jpeg', // 🙂
    neutral:     TW + '0cc5624b4b4d40f08de4fe36d7c5dfc8~mv2.jpeg', // 😐
    preocupado:  TW + '07f7c4ed22b0483ab9c0cf33fa4a2261~mv2.jpeg', // 😟
    triste:      TW + 'a65f0c0e5ee7452d896faef58b2ef18c~mv2.jpeg', // 😢
    llorando:    TW + 'e3dc640618df4ee9baa628f8776602cc~mv2.jpeg'  // 😭
  };
  // Respaldo en emoji de texto por si la imagen no llega a cargar
  const FACE_FALLBACK = {
    feliz:'😄', contento:'🙂', neutral:'😐', preocupado:'😟', triste:'😢', llorando:'😭'
  };

  const fmt = n => '$' + (Math.round((n||0)*100)/100).toLocaleString('es-MX',{minimumFractionDigits:0, maximumFractionDigits:2});
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

  function currentMonthKey(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }

  function defaultData(){
    return {
      month: currentMonthKey(),
      income: 0,
      categories: [
        {id: uid(), name:'Comida', icon:'🛒', budget:2000, transactions:[]},
        {id: uid(), name:'Transporte', icon:'🚗', budget:800, transactions:[]},
        {id: uid(), name:'Servicios (agua/luz/internet)', icon:'💡', budget:1200, transactions:[]},
        {id: uid(), name:'Mantenimiento', icon:'🔧', budget:500, transactions:[]},
      ]
    };
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultData();
      const data = JSON.parse(raw);
      if(!data.categories) return defaultData();
      data.categories.forEach(c=>{ if(!c.icon) c.icon = '💰'; });
      return data;
    }catch(e){
      console.error('Error leyendo localStorage', e);
      return defaultData();
    }
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){
      console.error('Error guardando en localStorage', e);
      alert('No se pudo guardar. Puede que el almacenamiento local esté lleno o bloqueado.');
    }
  }

  let state = load();
  let openId = null; // categoría expandida actualmente

  // ---------- ajuste automático cuando aparece el teclado en móvil ----------
  function adjustForKeyboard(){
    if(!window.visualViewport) return;
    const offset = window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop;
    document.documentElement.style.setProperty('--kb-offset', Math.max(0, Math.round(offset)) + 'px');
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', adjustForKeyboard);
    window.visualViewport.addEventListener('scroll', adjustForKeyboard);
  }

  function monthLabel(monthKey){
    const [y,m] = monthKey.split('-').map(Number);
    return MESES[m-1] + ' ' + y;
  }
  function catSpent(cat){ return cat.transactions.reduce((s,t)=>s+t.amount,0); }
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

  // ---------- color gradual de la barra (verde -> dorado -> rojo por debajo de 75%) ----------
  const COLOR_GREEN = [31,169,113];   // --green
  const COLOR_GOLD  = [215,154,31];   // --gold
  const COLOR_RED   = [229,83,61];    // --red
  function lerpColor(c1, c2, t){
    return [0,1,2].map(i => Math.round(c1[i] + (c2[i]-c1[i]) * t));
  }
  function drainColor(pct){
    if(pct >= 75) return COLOR_GREEN;
    if(pct >= 37.5){
      const t = (75 - pct) / (75 - 37.5);
      return lerpColor(COLOR_GREEN, COLOR_GOLD, t);
    }
    const t = Math.min(1, (37.5 - pct) / 37.5);
    return lerpColor(COLOR_GOLD, COLOR_RED, t);
  }
  function faceKeyForPct(pct){
    if(pct >= 80) return 'feliz';
    if(pct >= 60) return 'contento';
    if(pct >= 40) return 'neutral';
    if(pct >= 20) return 'preocupado';
    if(pct >= 10)   return 'triste';
    return 'llorando';
  }

  function render(){
    document.getElementById('mesLabel').textContent = monthLabel(state.month).replace(/^./,c=>c.toUpperCase());

    const totalApartados = state.categories.reduce((s,c)=>s+(Number(c.budget)||0),0);
    const totalSpent = state.categories.reduce((s,c)=>s+catSpent(c),0);
    const totalDisponible = totalApartados - totalSpent;

    const valEl = document.getElementById('valTotalApartados');
    valEl.textContent = fmt(totalDisponible);
    valEl.classList.toggle('neg', totalDisponible < 0);

    const pctDisponible = totalApartados > 0
      ? Math.max(0, Math.min(100, (totalDisponible/totalApartados)*100))
      : 100;

    const drainFill = document.getElementById('drainFill');
    drainFill.style.width = pctDisponible + '%';
    const [r,g,b] = drainColor(pctDisponible);
    drainFill.style.background = `rgb(${r},${g},${b})`;

    document.getElementById('drainCaption').textContent =
      totalApartados > 0 ? `Disponible: ${Math.round(pctDisponible)}%` : 'Sin presupuestos asignados';

    const faceKey = faceKeyForPct(totalApartados > 0 ? pctDisponible : 100);
    const faceImg = document.getElementById('totalFaceImg');
    const faceEmoji = document.getElementById('totalFaceEmoji');
    faceImg.style.display = '';
    faceEmoji.style.display = 'none';
    faceImg.onerror = ()=>{
      faceImg.style.display = 'none';
      faceEmoji.style.display = 'flex';
      faceEmoji.textContent = FACE_FALLBACK[faceKey];
    };
    faceImg.src = FACE_IMAGES[faceKey];

    const list = document.getElementById('list');
    list.innerHTML = '';

    if(state.categories.length === 0){
      const div = document.createElement('div');
      div.className = 'empty-state';
      div.textContent = 'Aún no tienes categorías. Crea la primera con "+ Categoría".';
      list.appendChild(div);
      return;
    }

    state.categories.forEach(cat => list.appendChild(renderRow(cat)));
  }

  function renderRow(cat){
    const spent = catSpent(cat);
    const budget = Number(cat.budget)||0;
    const remaining = budget - spent;
    const pct = budget > 0 ? Math.min(1, spent/budget) : (spent>0?1:0);

    const r = 22; const circumference = 2*Math.PI*r;
    const dashoffset = circumference * (1-pct);

    const wrapper = document.createElement('div');

    const row = document.createElement('div');
    row.className = 'row';
    if(remaining < 0) row.classList.add('over');
    else if(budget>0 && pct >= 0.8) row.classList.add('warn');

    const subText = remaining >= 0
      ? `Quedan ${fmt(remaining)} de ${fmt(budget)}`
      : `Excediste tu presupuesto por ${fmt(Math.abs(remaining))}`;

    row.innerHTML = `
      <div class="ring-wrap">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle class="ring-bg" cx="26" cy="26" r="${r}"></circle>
          <circle class="ring-fill" cx="26" cy="26" r="${r}"
            stroke-dasharray="${circumference}" stroke-dashoffset="${dashoffset}"></circle>
        </svg>
        <div class="icon-emoji">${cat.icon}</div>
      </div>
      <div class="row-mid">
        <div class="row-name">${escapeHtml(cat.name)}</div>
        <div class="row-sub ${remaining<0?'over':''}">${subText}</div>
      </div>
      <div class="row-right">
        <div class="row-amt ${remaining<0?'over':''}">${fmt(Math.max(remaining,0))}</div>
        <div class="row-budget">disponible</div>
      </div>
    `;
    row.addEventListener('click', ()=>{
      openId = (openId === cat.id) ? null : cat.id;
      render();
    });
    wrapper.appendChild(row);

    if(openId === cat.id){
      const detail = document.createElement('div');
      detail.className = 'detail open';
      detail.innerHTML = `
        <div class="detail-actions">
          <button class="chip-btn primary" data-act="gasto">+ Registrar gasto</button>
          <button class="chip-btn ghost" data-act="editar">Editar</button>
          <button class="chip-btn danger" data-act="eliminar">Eliminar</button>
        </div>
        <div class="tx-wrap"></div>
      `;
      detail.addEventListener('click', (e)=>e.stopPropagation());
      detail.querySelector('[data-act="gasto"]').addEventListener('click', ()=>openGastoModal(cat.id));
      detail.querySelector('[data-act="editar"]').addEventListener('click', ()=>openCategoriaModal(cat.id));
      detail.querySelector('[data-act="eliminar"]').addEventListener('click', ()=>deleteCategory(cat.id));

      const txWrap = detail.querySelector('.tx-wrap');
      if(cat.transactions.length===0){
        txWrap.innerHTML = '<div class="tx-empty">Sin movimientos todavía</div>';
      }else{
        txWrap.innerHTML = [...cat.transactions].reverse().map(t=>`
          <div class="tx-row">
            <div class="tx-date">${t.date}</div>
            <span class="tx-amt">-${fmt(t.amount)}</span>
            <button class="tx-del" data-tx="${t.id}">✕</button>
          </div>
        `).join('');
        txWrap.querySelectorAll('.tx-del').forEach(btn=>{
          btn.addEventListener('click', (e)=>{
            e.stopPropagation();
            const txId = e.target.getAttribute('data-tx');
            cat.transactions = cat.transactions.filter(t=>t.id!==txId);
            save(); render();
          });
        });
      }
      wrapper.appendChild(detail);
    }

    return wrapper;
  }

  function deleteCategory(id){
    const cat = state.categories.find(c=>c.id===id);
    if(!cat) return;
    if(confirm(`¿Eliminar la categoría "${cat.name}" y todo su historial? Esta acción no se puede deshacer.`)){
      state.categories = state.categories.filter(c=>c.id!==id);
      openId = null;
      save(); render();
    }
  }

  // ---------- modal: categoria (crear / editar) ----------
  const modalCategoria = document.getElementById('modalCategoria');
  let editingCatId = null;
  let selectedEmoji = EMOJIS[0];

  function buildEmojiRow(){
    const row = document.getElementById('emojiRow');
    row.innerHTML = '';
    EMOJIS.forEach(em=>{
      const btn = document.createElement('div');
      btn.className = 'emoji-opt' + (em===selectedEmoji ? ' sel' : '');
      btn.textContent = em;
      btn.addEventListener('click', ()=>{ selectedEmoji = em; buildEmojiRow(); });
      row.appendChild(btn);
    });
  }

  function openCategoriaModal(catId){
    editingCatId = catId || null;
    const cat = catId ? state.categories.find(c=>c.id===catId) : null;
    document.getElementById('catModalTitle').textContent = cat ? 'Editar categoría' : 'Nueva categoría';
    document.getElementById('catNombre').value = cat ? cat.name : '';
    document.getElementById('catBudget').value = cat ? cat.budget : '';
    selectedEmoji = cat ? cat.icon : EMOJIS[0];
    buildEmojiRow();
    modalCategoria.classList.add('open');
    requestAnimationFrame(()=>{
      document.getElementById('catNombre').focus();
      adjustForKeyboard();
    });
  }
  function closeCategoriaModal(){
    modalCategoria.classList.remove('open');
    editingCatId=null;
    document.documentElement.style.setProperty('--kb-offset','0px');
  }

  document.getElementById('btnNuevaCategoria').addEventListener('click', ()=>openCategoriaModal(null));
  document.getElementById('catCancel').addEventListener('click', closeCategoriaModal);
  modalCategoria.addEventListener('click', (e)=>{ if(e.target===modalCategoria) closeCategoriaModal(); });
  document.getElementById('catGuardar').addEventListener('click', ()=>{
    const name = document.getElementById('catNombre').value.trim();
    const budget = Math.max(0, Number(document.getElementById('catBudget').value)||0);
    if(!name){ alert('Ponle un nombre a la categoría.'); return; }
    if(editingCatId){
      const cat = state.categories.find(c=>c.id===editingCatId);
      cat.name = name.slice(0,30); cat.budget = budget; cat.icon = selectedEmoji;
    }else{
      state.categories.push({id:uid(), name:name.slice(0,30), icon:selectedEmoji, budget, transactions:[]});
    }
    save(); render(); closeCategoriaModal();
  });

  // ---------- modal: gasto ----------
  const modalGasto = document.getElementById('modalGasto');
  let gastoCatId = null;
  function openGastoModal(catId){
    gastoCatId = catId;
    const cat = state.categories.find(c=>c.id===catId);
    document.getElementById('gastoCatNombre').textContent = cat ? cat.name : '';
    document.getElementById('gastoMonto').value = '';
    modalGasto.classList.add('open');
    requestAnimationFrame(()=>{
      document.getElementById('gastoMonto').focus();
      adjustForKeyboard();
    });
  }
  function closeGastoModal(){
    modalGasto.classList.remove('open');
    gastoCatId=null;
    document.documentElement.style.setProperty('--kb-offset','0px');
  }

  document.getElementById('gastoCancel').addEventListener('click', closeGastoModal);
  modalGasto.addEventListener('click', (e)=>{ if(e.target===modalGasto) closeGastoModal(); });
  document.getElementById('gastoGuardar').addEventListener('click', ()=>{
    const cat = state.categories.find(c=>c.id===gastoCatId);
    if(!cat) return;
    const monto = Number(document.getElementById('gastoMonto').value);
    if(!monto || monto<=0){ alert('Escribe un monto válido.'); return; }
    const today = new Date();
    const dateStr = String(today.getDate()).padStart(2,'0')+'/'+String(today.getMonth()+1).padStart(2,'0');
    cat.transactions.push({id:uid(), amount:monto, date:dateStr});
    openId = cat.id;
    save(); render(); closeGastoModal();
  });

  // ---------- cerrar mes ----------
  document.getElementById('btnResetMes').addEventListener('click', ()=>{
    if(!confirm('Esto guarda tus presupuestos pero borra todos los movimientos registrados, para empezar un mes nuevo. ¿Continuar?')) return;
    state.month = currentMonthKey();
    state.categories.forEach(c => c.transactions = []);
    openId = null;
    save(); render();
  });

  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){ closeCategoriaModal(); closeGastoModal(); }
  });

  render();
})();
</script>
</body>
</html>
